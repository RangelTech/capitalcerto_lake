networks:
  # "internal" e so um nome, nao usa a flag internal:true do Docker: essa flag bloqueia
  # SAIDA pra internet (nao so entrada), e servicos aqui (Airflow sobretudo) precisam de
  # acesso real a APIs externas (ERP, Chatwoot, bureaus de credito). Isolamento de entrada
  # ja e garantido por nao publicar porta de host pra quem nao precisa, nao pela rede em si.
  # Bug encontrado e corrigido em 2026-08-26 ao testar o pipeline de ingestao pela primeira vez.
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  airflow_logs:
  uptime_kuma_data:
  traefik_letsencrypt:
  credhub_pg_data:

services:

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    restart: unless-stopped
    networks: [public]
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # dashboard, so IP direto por enquanto (sem dominio, ver SPEC.md secao 7)
    volumes:
      - ../configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro

  # Postgres local com o dump do CRM CredHub (carga fria de 2026-10-01). Provisorio: quando o banco oficial
  # for liberado, so reapontar a conexao Airflow credhub_postgres e este servico pode ser removido.
  credhub-postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: credhub
      POSTGRES_PASSWORD: ${CREDHUB_PG_PASSWORD}
      POSTGRES_DB: share
    volumes:
      - credhub_pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:${MINIO_VERSION}
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "9000:9000"
      - "9001:9001"   # console, IP direto por enquanto
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "8123:8123"   # HTTP interface, IP direto por enquanto
      - "9002:9000"   # native protocol (9000 do host ja usado pelo MinIO, remapeado)
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../configs/clickhouse/init:/docker-entrypoint-initdb.d:ro

  airflow-init:
    build:
      context: ../apps/airflow-image
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
    depends_on: [postgres]
    networks: [internal]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_ADMIN_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_ADMIN_USER: ${SHARED_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${SHARED_ADMIN_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Capital --lastname Certo --role Admin --email "$$AIRFLOW_ADMIN_USER"

  airflow-webserver:
    build:
      context: ../apps/airflow-image
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
    restart: unless-stopped
    depends_on: [airflow-init]
    networks: [internal, public]
    ports:
      - "8081:8080"   # IP direto por enquanto
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_ADMIN_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_CONN_MINIO_S3: "aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?endpoint_url=http%3A%2F%2Fminio%3A9000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ../configs/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: ../apps/airflow-image
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
    restart: unless-stopped
    depends_on: [airflow-init]
    networks: [internal]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_ADMIN_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_CONN_MINIO_S3: "aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?endpoint_url=http%3A%2F%2Fminio%3A9000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ../configs/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ../secrets/chatwoot_ed25519:/opt/airflow/secrets/chatwoot_ed25519:ro
    command: scheduler

  metabase:
    image: metabase/metabase:${METABASE_VERSION}
    restart: unless-stopped
    depends_on: [postgres]
    networks: [internal, public]
    ports:
      - "3000:3000"   # IP direto por enquanto
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres
      # "weak" so o login administrativo unico do projeto (ver SPEC.md secao 6.1) nao esbarra
      # no checador de senha comum do Metabase (zxcvbn), sem precisar trocar a senha em si.
      MB_PASSWORD_COMPLEXITY: weak

  ninerouter:
    build: ../apps/ninerouter
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "4000:4000"   # IP direto por enquanto
    environment:
      NINEROUTER_API_KEYS: ${NINEROUTER_API_KEYS}
    # Instancia propria e isolada deste projeto, sem relacao com nenhuma outra infra
    # da Rangel Tech (ver SPEC.md secao 1).

  risk-api:
    build: ../apps/risk-api
    restart: unless-stopped
    depends_on: [clickhouse, minio]
    networks: [internal, public]
    ports:
      - "8000:8000"   # IP direto por enquanto
    environment:
      RISK_API_SECRET_KEY: ${RISK_API_SECRET_KEY}
      RISK_API_KEYS: ${RISK_API_KEYS}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION}
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "3001:3001"   # IP direto por enquanto
    volumes:
      - uptime_kuma_data:/app/data
