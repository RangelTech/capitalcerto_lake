# Subdominios publicos (so o Data IA Hub e o Metabase). Os servicos ficam publicados no host e o Traefik fala com eles pelo gateway da rede compose_public.
http:
  routers:
    iadatahub:
      rule: "Host(`iadatahub.capitalcerto.rangeltech.net`)"
      entryPoints: [websecure]
      service: iadatahub
      tls:
        certResolver: letsencrypt
    metabase:
      rule: "Host(`metabase.capitalcerto.rangeltech.net`)"
      entryPoints: [websecure]
      service: metabase
      tls:
        certResolver: letsencrypt
  services:
    iadatahub:
      loadBalancer:
        servers:
          - url: "http://172.19.0.1:8088"
    metabase:
      loadBalancer:
        servers:
          - url: "http://172.19.0.1:3000"
